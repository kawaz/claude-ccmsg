name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # justfile の `test` / `coverage` recipe は lint と typecheck に依存しているので、
      # 1 つの step で lint → typecheck → test の順に走る (step を分けると依存で同じ
      # recipe が繰り返し走る)。
      # `test` (bun test)。packages/daemon/test/integration.test.ts の
      # 二重起動防止テストが packages/daemon/src/flock.ts の flock(2) を実際に exercise する。
      # ubuntu-latest で通ることで libc.so.6 経路 (docs/issue/2026-07-03-mvp-followups.md
      # 受け入れ条件 1) が CI 上で継続検証される。
      - name: Test
        if: matrix.os != 'macos-latest'
        run: just test

      # justfile の `coverage` recipe (bun test --coverage + package 別下限の検査)。
      # 下限 (justfile の coverage-thresholds) は macOS での実測から決めているので macOS だけで測る
      # (docs/findings/2026-10-14-test-coverage-baseline.md)
      - name: Test with coverage
        if: matrix.os == 'macos-latest'
        run: just coverage

      # validate (claude plugin validate .) は claude CLI が runner に無いため CI では実行しない。

  # hooks module の bundle (hooks/register.bundle.js) が今の source の bundle か。
  # bundle の中身は bundler の版で変わるので、上の job の latest ではなく、
  # bundle の 1 行目が記録している、それを作った bun で確かめる (hooks/bundle.ts)。
  hooks-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the bun that built the bundle
        id: bundler
        run: |
          version=$(sed -nE '1s/^\/\/ Generated by `just build-hooks` with bun ([^ ]+) .*/\1/p' hooks/register.bundle.js)
          test -n "$version" || { echo "hooks/register.bundle.js names no bun on its first line" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bundler.outputs.version }}

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the hooks module bundle
        run: just check-hooks-bundle
