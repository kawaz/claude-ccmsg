<title>ccmsgの伝言リレー</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#1d2730; --muted:#64727b; --line:#c9d2d4;
  --panel:#fffdf8; --blue:#1368a4; --blue-soft:#dcecf7; --orange:#e9783d;
  --yellow:#ffd66e; --green:#2b8a70; --shadow:0 18px 42px rgba(29,39,48,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#152026; --ink:#edf3f2; --muted:#a9b8bc; --line:#42545b; --panel:#202e34;
  --blue:#72b9eb; --blue-soft:#21455a; --orange:#f39a67; --yellow:#e2b94f; --green:#69c3a6; --shadow:0 18px 42px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{--bg:#152026;--ink:#edf3f2;--muted:#a9b8bc;--line:#42545b;--panel:#202e34;--blue:#72b9eb;--blue-soft:#21455a;--orange:#f39a67;--yellow:#e2b94f;--green:#69c3a6;--shadow:0 18px 42px rgba(0,0,0,.3)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif} .wrap{max-width:1050px;margin:auto;padding:42px 28px 64px}
.eyebrow{font:500 12px "DM Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:18px} h1{font-size:clamp(42px,7vw,84px);line-height:.98;letter-spacing:-.06em;margin:0;max-width:780px;text-wrap:balance} .lead{font-size:clamp(18px,2.5vw,25px);line-height:1.55;max-width:650px;margin:24px 0 44px;color:var(--muted)}
.diagram{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(24px,5vw,58px);position:relative;overflow:hidden}.diagram:before{content:"";position:absolute;width:260px;height:260px;border:1px solid var(--line);border-radius:50%;right:-90px;top:-110px;opacity:.6}.diagram-label{font:500 12px "DM Mono",monospace;letter-spacing:.12em;color:var(--muted);margin-bottom:34px}.flow{display:grid;grid-template-columns:1fr 90px 1.15fr 90px 1fr;align-items:center;gap:14px}.node{min-height:170px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid var(--ink);padding:22px;background:var(--panel);position:relative}.node small{font:500 12px "DM Mono",monospace;color:var(--muted);letter-spacing:.08em}.node strong{font-size:clamp(24px,3.8vw,42px);letter-spacing:-.05em;line-height:1}.node p{margin:0;font-size:15px;color:var(--muted)}.node.person{border-color:var(--orange)}.node.person strong{color:var(--orange)}.node.center{background:var(--blue);border-color:var(--blue);color:white;transform:translateY(-12px);box-shadow:10px 10px 0 var(--yellow)}.node.center small,.node.center p{color:#e4f4ff}.arrow{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--blue);font:500 11px "DM Mono",monospace;text-align:center}.arrow .shaft{width:100%;height:2px;background:var(--blue);position:relative}.arrow .shaft:after{content:"";position:absolute;right:0;top:-5px;border-left:10px solid var(--blue);border-top:6px solid transparent;border-bottom:6px solid transparent}
.note{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.note div{border-top:2px solid var(--line);padding-top:16px}.note b{display:block;font-size:17px;margin-bottom:5px}.note span{color:var(--muted);font-size:14px;line-height:1.6}.footer{margin-top:44px;display:flex;justify-content:space-between;gap:18px;align-items:flex-end;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px}.tag{font:500 12px "DM Mono",monospace;color:var(--green)}
@media(max-width:700px){.wrap{padding:28px 18px 44px}.flow{grid-template-columns:1fr;gap:18px}.node{min-height:135px}.node.center{transform:none}.arrow{transform:rotate(90deg);height:42px;width:70px;margin:auto}.note{grid-template-columns:1fr}.footer{display:block}.footer .tag{display:block;margin-top:10px}}
</style>
<main class="wrap">
  <div class="eyebrow">A tiny message relay</div>
  <h1>ccmsgは、Claude同士の「伝言リレー」。</h1>
  <p class="lead">別々の部屋にいるClaudeへ、短いメッセージを届ける道具です。</p>
  <section class="diagram" aria-label="ccmsgの仕組み">
    <div class="diagram-label">HOW IT MOVES</div>
    <div class="flow">
      <div class="node person"><small>FROM</small><strong>Claude A</strong><p>「調べたよ」</p></div>
      <div class="arrow"><span>post</span><i class="shaft"></i></div>
      <div class="node center"><small>RELAY</small><strong>ccmsg</strong><p>伝言を預かって、相手へ渡す</p></div>
      <div class="arrow"><span>subscribe</span><i class="shaft"></i></div>
      <div class="node person"><small>TO</small><strong>Claude B</strong><p>「受け取ったよ」</p></div>
    </div>
    <div class="note">
      <div><b>post</b><span>伝言を置く。</span></div>
      <div><b>subscribe</b><span>新しい伝言を待つ。</span></div>
    </div>
  </section>
  <div class="footer"><span>人間が間に入らなくても、作業をつなげられる。</span><span class="tag">message in → work continues</span></div>
</main>
